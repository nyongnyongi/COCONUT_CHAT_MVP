<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Coconut Chat</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding-bottom: 4.25rem;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        background: #fafafa;
        color: #222;
      }

      button {
        cursor: pointer;
      }

      input {
        width: 100%;
        padding: 0.85rem 1rem;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 1rem;
      }

      #auth-screen {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        background: white;
      }

      #auth-box {
        width: min(90vw, 360px);
        display: grid;
        gap: 0.75rem;
      }

      #auth-title {
        margin: 0 0 0.5rem;
        text-align: center;
      }

      #auth-actions,
      .button-row {
        display: flex;
        gap: 0.75rem;
      }

      #auth-actions button {
        flex: 1;
      }

      #auth-actions button,
      .primary-button,
      .danger-button,
      .small-button {
        border: 0;
        border-radius: 6px;
        background: #333;
        color: white;
        font-size: 1rem;
      }

      #auth-actions button,
      .primary-button,
      .danger-button {
        padding: 0.8rem 1rem;
      }

      .small-button {
        padding: 0.45rem 0.7rem;
        font-size: 0.85rem;
      }

      .small-button:disabled {
        cursor: default;
        opacity: 0.55;
      }

      #signup-button {
        background: #167a55;
      }

      .danger-button {
        background: #9b2c2c;
      }

      #auth-message,
      #page-message {
        min-height: 1.25rem;
        margin: 0;
        padding: 0.35rem 1rem;
        color: #c0392b;
        text-align: center;
        font-size: 0.9rem;
      }

      #app {
        display: none;
      }

      #top-bar {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.75rem 1rem;
        background: rgba(255, 255, 255, 0.92);
        border-bottom: 1px solid #e6e6e6;
        backdrop-filter: blur(10px);
      }

      #my-profile,
      .profile-line {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        min-width: 0;
      }

      #my-profile-image,
      .avatar {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        object-fit: cover;
        flex: 0 0 auto;
        background: #ddd;
      }

      #my-profile-image {
        display: none;
      }

      #my-profile-placeholder,
      .avatar-placeholder {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        background: #ddd;
        color: #555;
        font-weight: 700;
      }

      .blocked-avatar {
        display: grid;
        place-items: center;
        border: 1px solid #ddd;
        background: #f1f1f1;
        color: #9b2c2c;
        font-size: 1.25rem;
      }

      #my-nickname {
        display: block;
        max-width: 180px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #my-meta {
        color: #777;
        font-size: 0.8rem;
      }

      .view {
        display: none;
        padding: 1rem;
      }

      .view.active {
        display: block;
      }

      .section {
        display: grid;
        gap: 0.75rem;
        margin-bottom: 1rem;
      }

      .section-title {
        margin: 0.5rem 0;
        font-size: 1.05rem;
        text-align: center;
      }

      .list {
        display: grid;
        gap: 0.5rem;
      }

      .list-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 0.75rem;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        background: white;
      }

      .list-main {
        min-width: 0;
      }

      .list-title {
        font-weight: 700;
      }

      .list-sub {
        margin-top: 0.15rem;
        color: #777;
        font-size: 0.85rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .badge {
        min-width: 1.35rem;
        height: 1.35rem;
        display: inline-grid;
        place-items: center;
        padding: 0 0.4rem;
        border-radius: 999px;
        background: #e53935;
        color: white;
        font-size: 0.78rem;
        font-weight: 700;
      }

      #rooms-top-actions {
        position: relative;
        display: flex;
        justify-content: flex-end;
        margin-bottom: 1rem;
      }

      #new-chat-button {
        background: #111;
      }

      #new-chat-menu {
        position: absolute;
        top: calc(100% + 0.5rem);
        right: 0;
        z-index: 4;
        display: none;
        min-width: 160px;
        padding: 0.5rem;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        background: white;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      }

      #new-chat-menu.open {
        display: grid;
        gap: 0.5rem;
      }

      #direct-chat-panel,
      #group-chat-panel {
        display: none;
      }

      #direct-chat-panel.open,
      #group-chat-panel.open {
        display: grid;
      }

      #group-create-layout {
        width: min(100%, 520px);
        margin: 0 auto;
        display: grid;
        gap: 0.75rem;
      }

      #group-friends-list {
        display: none;
        gap: 0.5rem;
      }

      #group-friends-list.open {
        display: grid;
      }

      .group-friend-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 0.65rem 0.75rem;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        background: white;
      }

      .group-friend-item span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .group-friend-item input {
        width: auto;
        flex: 0 0 auto;
      }

      #room-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        margin-bottom: 0.75rem;
      }

      #room-title {
        margin: 0;
        font-size: 1.15rem;
        word-break: break-word;
      }

      #room-name-form {
        display: flex;
        gap: 0.75rem;
        margin-bottom: 0.75rem;
      }

      #room-name-input {
        flex: 1;
        min-width: 0;
      }

      #room-info-panel {
        display: none;
        gap: 0.5rem;
        margin-bottom: 0.75rem;
      }

      #room-info-panel.open {
        display: grid;
      }

      .member-menu {
        display: none;
        justify-content: flex-end;
        gap: 0.5rem;
        margin-top: 0.5rem;
      }

      .member-menu.open {
        display: flex;
      }

      #room-messages,
      #open-messages {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 0.6rem;
      }

      .message-row {
        position: relative;
        padding: 0.75rem;
        border: 1px solid #e6e6e6;
        border-radius: 8px;
        background: white;
      }

      .system-message {
        color: #777;
        text-align: center;
        font-size: 0.9rem;
      }

      .message-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
      }

      .message-sender {
        font-weight: 700;
      }

      .message-time {
        margin-left: 0.4rem;
        color: #888;
        font-size: 0.78rem;
      }

      .message-content {
        margin-top: 0.35rem;
        word-break: break-word;
      }

      .message-menu-button {
        width: 2rem;
        height: 2rem;
        border: 0;
        border-radius: 999px;
        background: #f0f0f0;
        color: #333;
        font-size: 1.1rem;
        line-height: 1;
      }

      .message-menu {
        display: none;
        justify-content: flex-end;
        gap: 0.5rem;
        margin-top: 0.55rem;
      }

      .message-menu.open {
        display: flex;
      }

      #room-form,
      #open-form {
        position: fixed;
        right: 0;
        bottom: 3.7rem;
        left: 0;
        display: none;
        gap: 0.75rem;
        padding: 0.75rem 1rem;
        background: rgba(250, 250, 250, 0.96);
        border-top: 1px solid #e6e6e6;
        backdrop-filter: blur(10px);
      }

      #room-form.active,
      #open-form.active {
        display: flex;
      }

      #room-input,
      #open-input {
        flex: 1;
        min-width: 0;
      }

      #bottom-tabs {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 8;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 0.25rem;
        padding: 0.45rem;
        background: white;
        border-top: 1px solid #e6e6e6;
      }

      #bottom-tabs button {
        padding: 0.65rem 0.25rem;
        border: 0;
        border-radius: 6px;
        background: #f2f2f2;
        color: #333;
      }

      #bottom-tabs button.active {
        background: #333;
        color: white;
      }

      @media (max-width: 720px) {
        #room-name-form,
        #room-header {
          flex-direction: column;
          align-items: stretch;
        }
      }
    </style>
  </head>

  <body>
    <div id="auth-screen">
      <div id="auth-box">
        <h1 id="auth-title">Coconut Chat</h1>

        <input id="username-input" autocomplete="username" placeholder="아이디" />

        <input
          id="password-input"
          type="password"
          autocomplete="current-password"
          placeholder="비밀번호 6자리 이상"
        />

        <div id="auth-actions">
          <button id="login-button" type="button">로그인</button>
          <button id="signup-button" type="button">회원가입</button>
        </div>

        <p id="auth-message"></p>
      </div>
    </div>

    <div id="app">
      <div id="top-bar">
        <div id="my-profile">
          <div id="my-profile-placeholder">?</div>
          <img id="my-profile-image" alt="프로필" />

          <div>
            <strong id="my-nickname">로그인 전</strong>
            <div id="my-meta">친구 코드: -</div>
          </div>
        </div>

        <button id="logout-button" class="danger-button" type="button">
          로그아웃
        </button>
      </div>

      <p id="page-message"></p>

      <main id="friends-view" class="view active">
        <section class="section">
          <h2 class="section-title">친구 추가</h2>
          <input id="friend-code-input" placeholder="친구 코드" />
          <button id="add-friend-button" class="primary-button" type="button">
            친구 추가
          </button>
        </section>

        <section class="section">
          <h2 class="section-title">친구 목록</h2>
          <div id="friends-list" class="list"></div>
        </section>
      </main>

      <main id="rooms-view" class="view">
        <div id="rooms-top-actions">
          <button id="new-chat-button" class="primary-button" type="button">
            새 채팅
          </button>

          <div id="new-chat-menu">
            <button id="direct-chat-option-button" class="small-button" type="button">
              1:1 채팅
            </button>
            <button id="group-chat-option-button" class="small-button" type="button">
              단체 채팅
            </button>
          </div>
        </div>

        <section id="direct-chat-panel" class="section">
          <h2 class="section-title">1:1 채팅 시작</h2>
          <div id="direct-friends-list" class="list"></div>
        </section>

        <section id="group-chat-panel" class="section">
          <h2 class="section-title">단체 채팅 만들기</h2>

          <div id="group-create-layout">
            <input
              id="group-name-input"
              placeholder="방 이름. 비워두면 멤버 닉네임으로 자동 생성"
            />

            <button id="toggle-group-friends-button" class="primary-button" type="button">
              초대할 친구 더보기
            </button>

            <div id="group-friends-list"></div>

            <button id="create-group-button" class="primary-button" type="button">
              선택한 친구와 단체 채팅
            </button>
          </div>
        </section>

        <section class="section">
          <h2 class="section-title">채팅방</h2>
          <div id="rooms-list" class="list"></div>
        </section>
      </main>

      <main id="room-view" class="view">
        <div id="room-header">
          <h2 id="room-title">채팅방</h2>

          <div class="button-row">
            <button id="room-info-button" class="primary-button" type="button">
              정보
            </button>
            <button id="leave-room-button" class="danger-button" type="button">
              나가기
            </button>
          </div>
        </div>

        <form id="room-name-form" action="">
          <input id="room-name-input" placeholder="채팅방 이름" />
          <button class="primary-button">이름 변경</button>
        </form>

        <div id="room-info-panel"></div>

        <ul id="room-messages"></ul>
      </main>

      <main id="open-view" class="view">
        <section class="section">
          <h2 class="section-title">오픈채팅</h2>
          <ul id="open-messages"></ul>
        </section>
      </main>

      <main id="settings-view" class="view">
        <section class="section">
          <h2 class="section-title">프로필</h2>
          <input id="nickname-edit-input" placeholder="새 닉네임" />
          <input id="status-message-input" placeholder="상태메시지" />
          <input id="profile-image-input" placeholder="프로필 이미지 주소" />

          <div class="button-row">
            <button id="save-nickname-button" class="primary-button" type="button">
              닉네임 저장
            </button>
            <button id="save-status-message-button" class="primary-button" type="button">
              상태 저장
            </button>
            <button id="save-profile-image-button" class="primary-button" type="button">
              이미지 저장
            </button>
          </div>
        </section>

        <section class="section">
          <h2 class="section-title">아이디 변경</h2>
          <input id="username-edit-input" placeholder="새 아이디" />
          <input
            id="username-password-input"
            type="password"
            placeholder="현재 비밀번호"
          />
          <button id="save-username-button" class="primary-button" type="button">
            아이디 변경
          </button>
        </section>

        <section class="section">
          <h2 class="section-title">비밀번호 변경</h2>
          <input
            id="current-password-input"
            type="password"
            placeholder="현재 비밀번호"
          />
          <input
            id="new-password-input"
            type="password"
            placeholder="새 비밀번호"
          />
          <input
            id="new-password-confirm-input"
            type="password"
            placeholder="새 비밀번호 확인"
          />
          <button id="save-password-button" class="primary-button" type="button">
            비밀번호 변경
          </button>
        </section>
      </main>

      <form id="room-form" action="">
        <input id="room-input" autocomplete="off" placeholder="메시지를 입력하세요" />
        <button class="primary-button">Send</button>
      </form>

      <form id="open-form" action="">
        <input id="open-input" autocomplete="off" placeholder="오픈채팅 메시지" />
        <button class="primary-button">Send</button>
      </form>

      <nav id="bottom-tabs">
        <button class="tab-button active" data-view="friends-view" type="button">
          친구
        </button>
        <button class="tab-button" data-view="rooms-view" type="button">
          채팅
        </button>
        <button class="tab-button" data-view="open-view" type="button">
          오픈
        </button>
        <button class="tab-button" data-view="settings-view" type="button">
          설정
        </button>
      </nav>
    </div>

    <script src="/socket.io/socket.io.js"></script>

    <script>
      let socket = null;
      let loginToken = null;
      let currentUser = null;
      let currentRoomId = null;
      let currentRoomLastMessageId = 0;
      let isLoggingOut = false;

      const authScreen = document.getElementById('auth-screen');
      const app = document.getElementById('app');

      const usernameInput = document.getElementById('username-input');
      const passwordInput = document.getElementById('password-input');
      const loginButton = document.getElementById('login-button');
      const signupButton = document.getElementById('signup-button');
      const authMessage = document.getElementById('auth-message');
      const pageMessage = document.getElementById('page-message');

      const myProfilePlaceholder = document.getElementById('my-profile-placeholder');
      const myProfileImage = document.getElementById('my-profile-image');
      const myNickname = document.getElementById('my-nickname');
      const myMeta = document.getElementById('my-meta');
      const logoutButton = document.getElementById('logout-button');

      const friendCodeInput = document.getElementById('friend-code-input');
      const addFriendButton = document.getElementById('add-friend-button');
      const friendsList = document.getElementById('friends-list');
      const directFriendsList = document.getElementById('direct-friends-list');
      const groupFriendsList = document.getElementById('group-friends-list');
      const groupNameInput = document.getElementById('group-name-input');
      const newChatButton = document.getElementById('new-chat-button');
      const newChatMenu = document.getElementById('new-chat-menu');
      const directChatOptionButton = document.getElementById('direct-chat-option-button');
      const groupChatOptionButton = document.getElementById('group-chat-option-button');
      const directChatPanel = document.getElementById('direct-chat-panel');
      const groupChatPanel = document.getElementById('group-chat-panel');
      const toggleGroupFriendsButton = document.getElementById('toggle-group-friends-button');
      const createGroupButton = document.getElementById('create-group-button');

      const roomsList = document.getElementById('rooms-list');
      const roomTitle = document.getElementById('room-title');
      const roomInfoButton = document.getElementById('room-info-button');
      const roomInfoPanel = document.getElementById('room-info-panel');
      const roomNameForm = document.getElementById('room-name-form');
      const roomNameInput = document.getElementById('room-name-input');
      const roomMessages = document.getElementById('room-messages');
      const roomForm = document.getElementById('room-form');
      const roomInput = document.getElementById('room-input');
      const leaveRoomButton = document.getElementById('leave-room-button');

      const openMessages = document.getElementById('open-messages');
      const openForm = document.getElementById('open-form');
      const openInput = document.getElementById('open-input');

      const nicknameEditInput = document.getElementById('nickname-edit-input');
      const statusMessageInput = document.getElementById('status-message-input');
      const profileImageInput = document.getElementById('profile-image-input');
      const saveNicknameButton = document.getElementById('save-nickname-button');
      const saveStatusMessageButton = document.getElementById('save-status-message-button');
      const saveProfileImageButton = document.getElementById('save-profile-image-button');

      const usernameEditInput = document.getElementById('username-edit-input');
      const usernamePasswordInput = document.getElementById('username-password-input');
      const saveUsernameButton = document.getElementById('save-username-button');

      const currentPasswordInput = document.getElementById('current-password-input');
      const newPasswordInput = document.getElementById('new-password-input');
      const newPasswordConfirmInput = document.getElementById('new-password-confirm-input');
      const savePasswordButton = document.getElementById('save-password-button');

      const tabButtons = document.querySelectorAll('.tab-button');

      function setPageMessage(text, ok = false) {
        pageMessage.style.color = ok ? '#167a55' : '#c0392b';
        pageMessage.textContent = text || '';
      }

      async function authFetch(url, options = {}) {
        return fetch(url, {
          ...options,
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${loginToken}`,
            ...(options.headers || {})
          }
        });
      }

      function formatTime(value) {
        if (!value) {
          return '';
        }

        return new Date(value).toLocaleTimeString('ko-KR', {
          hour: '2-digit',
          minute: '2-digit'
        });
      }

      function createAvatar(user) {
        if (user.isBlocked) {
          const blocked = document.createElement('div');
          blocked.className = 'avatar blocked-avatar';
          blocked.textContent = '🚫';
          return blocked;
        }

        if (user.profileImage) {
          const image = document.createElement('img');
          image.className = 'avatar';
          image.src = user.profileImage;
          image.alt = '프로필';
          return image;
        }

        const placeholder = document.createElement('div');
        placeholder.className = 'avatar-placeholder';
        placeholder.textContent = (user.nickname || user.username || '?')
          .slice(0, 1)
          .toUpperCase();

        return placeholder;
      }

      function renderProfileImage(profileImage) {
        if (profileImage) {
          myProfileImage.src = profileImage;
          myProfileImage.style.display = 'block';
          myProfilePlaceholder.style.display = 'none';
        } else {
          myProfileImage.removeAttribute('src');
          myProfileImage.style.display = 'none';
          myProfilePlaceholder.style.display = 'grid';
        }
      }

      function renderMe(user) {
        currentUser = user;

        myNickname.textContent = user.nickname || user.username;
        myMeta.textContent = `친구 코드: ${user.friendCode}`;

        nicknameEditInput.value = user.nickname || user.username;
        statusMessageInput.value = user.statusMessage || '';
        profileImageInput.value = user.profileImage || '';
        usernameEditInput.value = user.username;
        usernamePasswordInput.value = '';

        myProfilePlaceholder.textContent = (user.nickname || user.username || '?')
          .slice(0, 1)
          .toUpperCase();

        renderProfileImage(user.profileImage);
      }

      function showView(viewId) {
        document.querySelectorAll('.view').forEach((view) => {
          view.classList.toggle('active', view.id === viewId);
        });

        tabButtons.forEach((button) => {
          button.classList.toggle('active', button.dataset.view === viewId);
        });

        roomForm.classList.toggle('active', viewId === 'room-view');
        openForm.classList.toggle('active', viewId === 'open-view');

        if (viewId !== 'room-view') {
          currentRoomId = null;
          currentRoomLastMessageId = 0;
          roomInfoPanel.classList.remove('open');
        }
      }

      function renderRoomMessage(message) {
        const item = document.createElement('li');
        item.className = 'message-row';
        item.dataset.messageId = message.id;

        const head = document.createElement('div');
        head.className = 'message-head';

        const sender = document.createElement('div');

        senderName.textContent = message.senderName;

        const time = document.createElement('span');
        time.className = 'message-time';
        time.textContent = formatTime(message.createdAt);

        sender.appendChild(senderName);
        sender.appendChild(time);

        const menuButton = document.createElement('button');
        menuButton.type = 'button';
        menuButton.className = 'message-menu-button';
        menuButton.textContent = '...';

        const content = document.createElement('div');
        content.className = 'message-content';
        content.textContent = message.content;

        const menu = document.createElement('div');
        menu.className = 'message-menu';

        const deleteForMeButton = document.createElement('button');
        deleteForMeButton.type = 'button';
        deleteForMeButton.className = 'small-button';
        deleteForMeButton.textContent = '나에게서 삭제';

        const deleteForEveryoneButton = document.createElement('button');
        deleteForEveryoneButton.type = 'button';
        deleteForEveryoneButton.className = 'small-button';
        deleteForEveryoneButton.textContent = '모두에게서 삭제';

        menuButton.addEventListener('click', () => {
          menu.classList.toggle('open');
        });

        deleteForMeButton.addEventListener('click', async () => {
          await deleteMessageForMe(message.id);
          item.remove();
        });

        deleteForEveryoneButton.addEventListener('click', async () => {
          await deleteMessageForEveryone(message.id);
        });

        menu.appendChild(deleteForMeButton);

        if (String(message.senderId) === String(currentUser.id)) {
          menu.appendChild(deleteForEveryoneButton);
        }

        head.appendChild(sender);
        head.appendChild(menuButton);
        item.appendChild(head);
        item.appendChild(content);
        item.appendChild(menu);
        roomMessages.appendChild(item);

        currentRoomLastMessageId = Math.max(currentRoomLastMessageId, Number(message.id));
        window.scrollTo(0, document.body.scrollHeight);
      }

      async function requestAuth(type) {
        const username = usernameInput.value.trim();
        const password = passwordInput.value;

        authMessage.style.color = '#c0392b';
        authMessage.textContent = '';

        if (!username || password.length < 6) {
          authMessage.textContent = '아이디와 6자 이상 비밀번호가 필요합니다.';
          return;
        }

        try {
          const response = await fetch(`/api/${type}`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ username, password })
          });

          const data = await response.json();

          if (!response.ok) {
            authMessage.textContent = data.message || '요청 실패';
            return;
          }

          if (type === 'signup') {
            authMessage.style.color = '#167a55';
            authMessage.textContent = '회원가입 완료! 이제 로그인하세요.';
            passwordInput.value = '';
            passwordInput.focus();
            return;
          }

          loginToken = data.token;
          localStorage.setItem('loginToken', loginToken);

          renderMe(data.user);
          startApp();
        } catch (e) {
          authMessage.textContent = '서버 연결 실패';
        }
      }

      async function loadMe() {
        loginToken = localStorage.getItem('loginToken');

        if (!loginToken) {
          return;
        }

        try {
          const response = await authFetch('/api/me');

          if (!response.ok) {
            localStorage.removeItem('loginToken');
            loginToken = null;
            return;
          }

          const data = await response.json();

          renderMe(data.user);
          startApp();
        } catch (e) {
          localStorage.removeItem('loginToken');
          loginToken = null;
        }
      }

      function startApp() {
        isLoggingOut = false;

        authScreen.style.display = 'none';
        app.style.display = 'block';

        connectSocket();
        loadFriends();
        loadRooms();
      }

      function connectSocket() {
        if (socket) {
          socket.disconnect();
        }

        socket = io({
          auth: {
            token: loginToken
          }
        });

        socket.on('connect_error', () => {
          authScreen.style.display = 'flex';
          app.style.display = 'none';
          authMessage.textContent = '채팅 서버 인증에 실패했습니다.';
        });

        socket.on('auth error', (msg) => {
          authScreen.style.display = 'flex';
          app.style.display = 'none';
          authMessage.textContent = msg || '로그인이 필요합니다.';
        });

        socket.on('chat message', (username, msg) => {
          if (isLoggingOut) {
            return;
          }

          addOpenMessage(`[${username}] ${msg}`);
        });

        socket.on('system message', (msg) => {
          if (isLoggingOut) {
            return;
          }

          addOpenMessage(msg, 'system-message');
        });

        socket.on('room message', (message) => {
          const roomViewIsOpen = document
            .getElementById('room-view')
            .classList.contains('active');

          if (
            roomViewIsOpen &&
            currentRoomId &&
            String(message.roomId) === String(currentRoomId)
          ) {
            renderRoomMessage(message);
            markCurrentRoomRead(message.id);
          }

          loadRooms();
        });

        socket.on('rooms changed', () => {
          loadRooms();
        });

        socket.on('friends changed', () => {
          loadFriends();

          if (currentRoomId && roomInfoPanel.classList.contains('open')) {
            loadRoomMembers();
          }
        });

        socket.on('room message deleted', (payload) => {
          if (!currentRoomId || String(payload.roomId) !== String(currentRoomId)) {
            loadRooms();
            return;
          }

          const item = roomMessages.querySelector(
            `[data-message-id="${payload.messageId}"]`
          );

          if (!item) {
            return;
          }

          const content = item.querySelector('.message-content');
          const menu = item.querySelector('.message-menu');

          content.textContent = '삭제된 메시지입니다.';

          if (menu) {
            menu.remove();
          }

          loadRooms();
        });
      }

        roomNameInput.value = title;
        roomMessages.innerHTML = '';
        roomInfoPanel.innerHTML = '';
        roomInfoPanel.classList.remove('open');

        showView('room-view');

        if (socket) {
          socket.emit('join room', roomId);
        }

        try {
          const response = await authFetch(`/api/rooms/${roomId}/messages`);
          const data = await response.json();

          if (!response.ok) {
            setPageMessage(data.message || '메시지 조회 실패');
            return;
          }

          for (const message of data.messages) {
            renderRoomMessage(message);
          }

          if (currentRoomLastMessageId > 0) {
            markCurrentRoomRead(currentRoomLastMessageId);
          }

          loadRooms();
        } catch (e) {
          setPageMessage('메시지 조회 중 서버 연결 실패');
        }
      }

            })
          });

          const data = await response.json();

          if (!response.ok) {
            setPageMessage(data.message || '아이디 변경 실패');
            return;
          }

          loginToken = data.token;
          localStorage.setItem('loginToken', loginToken);

          renderMe(data.user);
          usernamePasswordInput.value = '';
          setPageMessage(data.message || '아이디를 변경했습니다.', true);
        } catch (e) {
          setPageMessage('아이디 변경 중 서버 연결 실패');
        }
      }

      async function savePassword() {
        try {
          const response = await authFetch('/api/me/password', {
            method: 'PATCH',
            body: JSON.stringify({
              currentPassword: currentPasswordInput.value,
              newPassword: newPasswordInput.value,
              newPasswordConfirm: newPasswordConfirmInput.value
            })
          });

          const data = await response.json();

          if (!response.ok) {
            setPageMessage(data.message || '비밀번호 변경 실패');
            return;
          }

          currentPasswordInput.value = '';
          newPasswordInput.value = '';
          newPasswordConfirmInput.value = '';
          setPageMessage(data.message || '비밀번호를 변경했습니다.', true);
        } catch (e) {
          setPageMessage('비밀번호 변경 중 서버 연결 실패');
        }
      }

      function logout() {
        isLoggingOut = true;

        localStorage.removeItem('loginToken');
        loginToken = null;
        currentUser = null;
        currentRoomId = null;
        currentRoomLastMessageId = 0;

        if (socket) {
          socket.disconnect();
          socket = null;
        }

        // 오픈채팅 입장/퇴장 알림과 오픈채팅 메시지는 화면에만 쌓이는 로그다.
        // 로그아웃하면 다음 로그인 때 이전 사용자의 오픈채팅 로그가 남지 않도록 초기화한다.
        openMessages.innerHTML = '';

        app.style.display = 'none';
        authScreen.style.display = 'flex';
        authMessage.textContent = '';
        pageMessage.textContent = '';
        passwordInput.value = '';
      }

      loginButton.addEventListener('click', () => requestAuth('login'));
      signupButton.addEventListener('click', () => requestAuth('signup'));

      passwordInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          requestAuth('login');
        }
      });

      addFriendButton.addEventListener('click', addFriendByCode);

      newChatButton.addEventListener('click', () => {
        newChatMenu.classList.toggle('open');
      });

      directChatOptionButton.addEventListener('click', () => {
        openNewChatPanel('direct');
      });

      groupChatOptionButton.addEventListener('click', () => {
        openNewChatPanel('group');
      });

      toggleGroupFriendsButton.addEventListener('click', () => {
        groupFriendsList.classList.toggle('open');
      });

      createGroupButton.addEventListener('click', createGroupRoom);
      leaveRoomButton.addEventListener('click', leaveCurrentRoom);

      roomInfoButton.addEventListener('click', () => {
        roomInfoPanel.classList.toggle('open');

        if (roomInfoPanel.classList.contains('open')) {
          loadRoomMembers();
        }
      });

      roomNameForm.addEventListener('submit', (e) => {
        e.preventDefault();
        renameCurrentRoom();
      });

      saveNicknameButton.addEventListener('click', saveNickname);
      saveStatusMessageButton.addEventListener('click', saveStatusMessage);
      saveProfileImageButton.addEventListener('click', saveProfileImage);
      saveUsernameButton.addEventListener('click', saveUsername);
      savePasswordButton.addEventListener('click', savePassword);
      logoutButton.addEventListener('click', logout);

      roomForm.addEventListener('submit', (e) => {
        e.preventDefault();

        if (!socket || !currentRoomId || !roomInput.value.trim()) {
          return;
        }

        socket.emit('room message', currentRoomId, roomInput.value, () => {
          roomInput.value = '';
        });
      });

      openForm.addEventListener('submit', (e) => {
        e.preventDefault();

        if (!socket || !openInput.value.trim()) {
          return;
        }

        socket.emit('chat message', openInput.value, () => {
          openInput.value = '';
        });
      });

      tabButtons.forEach((button) => {
        button.addEventListener('click', () => {
          showView(button.dataset.view);

          if (button.dataset.view === 'friends-view') {
            loadFriends();
          }

          if (button.dataset.view === 'rooms-view') {
            loadRooms();
          }
        });
      });

      loadMe();
    </script>
  </body>
</html>
