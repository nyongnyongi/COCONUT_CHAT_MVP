<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Socket.IO chat</title>
    <style>
      body { margin: 0; padding-bottom: 3rem; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

      #nickname-screen {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: white;
        z-index: 10;
      }

      #nickname-box {
        display: flex;
        gap: 0.5rem;
      }

      #nickname-input {
        padding: 0.75rem 1rem;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 1rem;
      }

      #nickname-button {
        padding: 0.75rem 1rem;
        border: none;
        background: #333;
        color: white;
        border-radius: 4px;
        font-size: 1rem;
      }

      #form { background: rgba(0, 0, 0, 0.15); padding: 0.25rem; position: fixed; bottom: 0; left: 0; right: 0; display: flex; height: 3rem; box-sizing: border-box; backdrop-filter: blur(10px); }
      #input { border: none; padding: 0 1rem; flex-grow: 1; border-radius: 2rem; margin: 0.25rem; }
      #input:focus { outline: none; }
      #form > button { background: #333; border: none; padding: 0 1rem; margin: 0.25rem; border-radius: 3px; outline: none; color: #fff; }

      #messages { list-style-type: none; margin: 0; padding: 0; }
      #messages > li { padding: 0.5rem 1rem; }
      #messages > li:nth-child(odd) { background: #efefef; }
    </style>
  </head>
  <body>
    <div id="nickname-screen">
      <div id="nickname-box">
        <input id="nickname-input" autocomplete="off" placeholder="닉네임" />
        <button id="nickname-button">시작</button>
      </div>
    </div>

    <ul id="messages"></ul>

    <form id="form" action="">
      <input id="input" autocomplete="off" />
      <button>Send</button>
    </form>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      let counter = 0;
      let nickname = '익명';
      let socket;

      const nicknameScreen = document.getElementById('nickname-screen');
      const nicknameInput = document.getElementById('nickname-input');
      const nicknameButton = document.getElementById('nickname-button');

      const form = document.getElementById('form');
      const input = document.getElementById('input');
      const messages = document.getElementById('messages');

      function startChat() {
        nickname = nicknameInput.value.trim() || '익명';

        // prompt가 안 뜨는 문제를 피하기 위해 직접 만든 닉네임 입력 화면을 숨김.
        nicknameScreen.style.display = 'none';

        // 닉네임이 정해진 뒤에 Socket.IO 연결을 시작함.
        socket = io({
          ackTimeout: 10000,
          retries: 3,
          auth: {
            serverOffset: 0
          }
        });

        socket.emit('set nickname', nickname, () => {
  console.log('nickname registered');
});

        socket.on('chat message', (nickname, msg, serverOffset) => {
          const item = document.createElement('li');

          // 기존에는 msg만 출력했음.
          // 이제 서버에서 받은 nickname과 msg를 같이 출력함.
          item.textContent = `[${nickname}] ${msg}`;

          messages.appendChild(item);
          window.scrollTo(0, document.body.scrollHeight);

          socket.auth.serverOffset = serverOffset;
        });

        socket.on('system message', (msg) => {
          const item = document.createElement('li');
          item.textContent = msg;
          item.style.color = '#777';
          item.style.textAlign = 'center';
          messages.appendChild(item);
          window.scrollTo(0, document.body.scrollHeight);
        });
      }

      nicknameButton.addEventListener('click', startChat);

      nicknameInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          startChat();
        }
      });

      form.addEventListener('submit', (e) => {
        e.preventDefault();

        if (!socket) {
          return;
        }

        if (input.value) {
          const clientOffset = `${socket.id}-${counter++}`;

          // 기존에는 input.value, clientOffset만 보냈음.
          // 이제 nickname, input.value, clientOffset 순서로 보냄.
          socket.emit('chat message', nickname, input.value, clientOffset, () => {
            input.value = '';
          });

          input.value = '';
        }
      });
    </script>
  </body>
</html>
