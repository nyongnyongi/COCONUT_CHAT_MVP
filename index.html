<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Coconut Chat</title>
    <!-- PWA 설정: 모바일 홈 화면에 추가했을 때 앱 이름, 아이콘, 테마색을 manifest.json에서 읽게 한다. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2aa8f2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Coconut Chat" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding-bottom: 7rem;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        color: #17202a;
        min-height: 100vh;
        overflow-y: auto;

        /* beach-bg.png is the generated beach background.
           cover fills the viewport, fixed keeps the beach still while scrolling. */
        background:
          linear-gradient(
            rgba(255, 255, 255, 0.08),
            rgba(255, 255, 255, 0.2)
          ),
          url("beach-bg.png") center / cover fixed;
      }

      button {
        cursor: pointer;
      }

      input {
        width: 100%;
        padding: 0.85rem 1rem;
        border: 1px solid #d7dde5;
        border-radius: 10px;
        font-size: 1rem;
      }

      input:focus {
        outline: 2px solid rgba(34, 154, 255, 0.25);
        border-color: #229aff;
      }

      #auth-screen {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;

        /* #auth-screen covers the whole page, so it needs the beach background too. */
        background:
          linear-gradient(
            rgba(255, 255, 255, 0.04),
            rgba(255, 255, 255, 0.14)
          ),
          url("beach-bg.png") center / cover fixed;
      }

      #auth-screen::before {
        content: "Chat. Connect. Unwind.";
        position: fixed;
        left: clamp(2rem, 12vw, 11rem);
        top: 54%;
        width: min(34vw, 430px);
        color: #102a43;
        font-size: clamp(2rem, 3vw, 3rem);
        font-weight: 800;
        line-height: 1.18;
        text-shadow: 0 2px 18px rgba(255, 255, 255, 0.5);
      }

      #auth-screen::after {
        content: "Coconut Chat is a simple, fast, and secure way to connect with the people who matter.";
        position: fixed;
        left: clamp(2rem, 12vw, 11rem);
        top: calc(54% + 5.4rem);
        width: min(34vw, 430px);
        color: #35516f;
        font-size: 1rem;
        line-height: 1.85;
        text-shadow: 0 2px 18px rgba(255, 255, 255, 0.5);
      }

      #auth-box {
        width: min(92vw, 430px);
        display: grid;
        gap: 0.78rem;
        padding: clamp(1.5rem, 4vw, 2.4rem);
        border: 1px solid rgba(255, 255, 255, 0.72);
        border-radius: 26px;

        /* This glass card matches the reference login panel without changing login logic. */
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.82),
          rgba(255, 255, 255, 0.7)
        );
        box-shadow: 0 28px 80px rgba(8, 57, 94, 0.28);
        backdrop-filter: blur(20px);
      }

      #auth-logo {
        width: 150px;
        height: 150px;
        margin: 0 auto -0.2rem;
        object-fit: contain;
        filter: drop-shadow(0 12px 18px rgba(66, 39, 12, 0.18));
      }

      #auth-title {
        margin: 0;
        color: #102a43;
        text-align: center;
        font-size: clamp(2rem, 5vw, 2.55rem);
        font-weight: 850;
        letter-spacing: 0;
      }

      #auth-mark {
        width: 42px;
        height: 4px;
        margin: 0.15rem auto 0.2rem;
        border-radius: 999px;
        background: rgba(43, 132, 189, 0.22);
      }

      #auth-subtitle {
        margin: 0 0 0.35rem;
        color: #6b7d90;
        text-align: center;
        font-size: 0.95rem;
        font-weight: 600;
      }

      #auth-box input {
        height: 3.25rem;
        border: 1px solid rgba(138, 160, 182, 0.38);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: inset 0 1px 2px rgba(16, 42, 67, 0.04);
      }

      #auth-box input::placeholder {
        color: #8797a8;
      }


      #auth-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.75rem;
      }

      #login-button {
        background: linear-gradient(135deg, #2f73ff, #28a9ff);
        box-shadow: 0 10px 22px rgba(30, 144, 255, 0.3);
      }

      #signup-button {
        background: rgba(255, 255, 255, 0.86);
        color: #137fe8;
        border: 1px solid rgba(138, 160, 182, 0.32);
      }



      #auth-actions,
      .button-row {
        display: flex;
        gap: 0.75rem;
      }

      #auth-actions button {
        flex: 1;
      }

      #auth-actions button,
      .primary-button,
      .danger-button,
      .small-button {
        border: 0;
        border-radius: 10px;
        background: #111827;
        color: white;
        font-size: 1rem;
      }

      #auth-actions button,
      .primary-button,
      .danger-button {
        padding: 0.8rem 1rem;
      }

      .small-button {
        padding: 0.45rem 0.7rem;
        font-size: 0.85rem;
      }

      .small-button:disabled {
        opacity: 0.5;
        cursor: default;
      }


      .danger-button {
        background: #a83232;
      }

      #auth-message,
      #page-message {
        min-height: 1.25rem;
        margin: 0;
        padding: 0.35rem 1rem;
        color: #c0392b;
        text-align: center;
        font-size: 0.9rem;
      }

      #app {
        display: none;
        width: min(100% - 2rem, 980px);
        min-height: calc(100vh - 2rem);
        margin: 1rem auto 7.5rem;
        overflow: visible;
        border: 1px solid rgba(255, 255, 255, 0.65);
        border-radius: 28px;

        /* 로그인 후 화면 전체를 하나의 큰 앱 패널로 묶는다.
           JS 동작은 그대로 두고, 보이는 껍데기만 시안 쪽으로 바꾸는 부분이다. */
        background: rgba(255, 255, 255, 0.68);
        box-shadow: 0 24px 70px rgba(8, 57, 94, 0.25);
        backdrop-filter: blur(18px);
      }

      #top-actions {
        position: relative;
        display: flex;
        align-items: center;
        gap: 0.55rem;
        flex: 0 0 auto;
      }

      #total-unread-badge {
        position: absolute;
        top: -0.35rem;
        right: -0.35rem;
        min-width: 1.35rem;
        height: 1.35rem;
        display: none;
        place-items: center;
        padding: 0 0.38rem;
        border: 2px solid rgba(255, 255, 255, 0.95);
        border-radius: 999px;
        background: #e53935;
        color: white;
        font-size: 0.74rem;
        font-weight: 900;
        line-height: 1;
        box-shadow: 0 7px 18px rgba(229, 57, 53, 0.28);
        z-index: 2;
      }

      #total-unread-badge.visible {
        display: grid;
      }
      #top-bar {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.75rem 1rem;
        background: rgba(255, 255, 255, 0.72);
        border-bottom: 1px solid #e3e8ef;
        backdrop-filter: blur(10px);
      }

      #my-profile,
      .profile-line {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        min-width: 0;
      }

      #my-profile-image,
      .avatar {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        object-fit: cover;
        flex: 0 0 auto;
        background: #dde4ec;
      }

      #my-profile-image {
        display: none;
      }

      #my-profile-placeholder,
      .avatar-placeholder {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        background: #dde4ec;
        color: #536273;
        font-weight: 700;
      }

      .blocked-avatar {
        background: #f1f1f1;
        color: #b42318;
        font-size: 1.4rem;
      }

      #my-nickname {
        display: block;
        max-width: 180px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #my-meta,
      .list-sub {
        color: #7b8794;
        font-size: 0.85rem;
      }


      .friend-code-row {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        color: #7b8794;
        font-size: 0.85rem;
      }

      .friend-code-row #my-meta {
        color: inherit;
      }

      #copy-friend-code-button {
        width: 1.65rem;
        height: 1.65rem;
        display: inline-grid;
        place-items: center;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: inherit;
        padding: 0;
        cursor: pointer;
      }

      #copy-friend-code-button:hover {
        background: rgba(23, 32, 42, 0.08);
      }

      #copy-friend-code-button svg {
        width: 1rem;
        height: 1rem;
        stroke: currentColor;
      }
      .view {
        display: none;
        padding: 1rem 1rem 8rem;
      }

      .view.active {
        display: block;
      }

      .section {
        display: grid;
        gap: 0.75rem;
        margin-bottom: 1rem;
        padding: 1rem;
        border: 1px solid #e3e8ef;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.82);
      }

      .section-title {
        margin: 0.25rem 0;
        font-size: 1.05rem;
        text-align: center;
      }

      .list {
        display: grid;
        gap: 0.5rem;
      }

      .list-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 0.75rem;
        border: 1px solid #e3e8ef;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.82);
      }

      .list-main {
        min-width: 0;
      }

      .list-title {
        font-weight: 700;
      }

      .list-sub {
        margin-top: 0.15rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .badge {
        min-width: 1.35rem;
        height: 1.35rem;
        display: inline-grid;
        place-items: center;
        padding: 0 0.4rem;
        border-radius: 999px;
        background: #e53935;
        color: white;
        font-size: 0.78rem;
        font-weight: 700;
      }

      #rooms-top-actions {
        position: relative;
        display: flex;
        justify-content: flex-end;
        margin-bottom: 1rem;
      }

      #new-chat-button {
        background: #111;
      }

      #new-chat-menu {
        position: absolute;
        top: calc(100% + 0.5rem);
        right: 0;
        z-index: 4;
        display: none;
        min-width: 160px;
        padding: 0.5rem;
        border: 1px solid #e3e8ef;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      }

      #new-chat-menu.open {
        display: grid;
        gap: 0.5rem;
      }

      #direct-chat-panel,
      #group-chat-panel {
        display: none;
      }

      #direct-chat-panel.open,
      #group-chat-panel.open {
        display: grid;
      }

      #group-create-layout {
        width: min(100%, 520px);
        margin: 0 auto;
        display: grid;
        gap: 0.75rem;
      }

      #group-friends-list {
        display: none;
        gap: 0.5rem;
      }

      #group-friends-list.open {
        display: grid;
      }

      .group-friend-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 0.65rem 0.75rem;
        border: 1px solid #e3e8ef;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.82);
      }

      .group-friend-item input {
        width: auto;
      }

      #room-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        margin-bottom: 0.75rem;
      }

      #room-title {
        margin: 0;
        font-size: 1.15rem;
        word-break: break-word;
      }

      #room-name-form {
        display: flex;
        gap: 0.75rem;
        margin-bottom: 0.75rem;
      }

      #room-name-input {
        flex: 1;
        min-width: 0;
      }

      #room-info-panel {
        display: none;
        gap: 0.5rem;
        margin-bottom: 0.75rem;
      }

      #room-info-panel.open {
        display: grid;
      }

      .member-menu {
        display: none;
        justify-content: flex-end;
        gap: 0.5rem;
        margin-top: 0.5rem;
      }

      .member-menu.open {
        display: flex;
      }

      #room-messages,
      #open-messages {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }

      .message-row {
        position: relative;
        width: fit-content;
        max-width: min(74%, 560px);
        padding: 0.75rem 0.9rem;
        border: 1px solid #e3e8ef;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.82);
        word-break: break-word;
      }

      .message-row.mine {
        align-self: flex-end;
        margin-left: auto;
        margin-right: 0;
        background: #9ee2ff;
        border-color: #7bcfff;
        color: #102a43;
      }

      .message-row.theirs {
        align-self: flex-start;
        margin-left: 0;
        margin-right: auto;
        background: rgba(255, 255, 255, 0.82);
      }

      .message-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
      }

      .message-sender {
        font-weight: 700;
      }

      .message-content {
        margin-top: 0.35rem;
      }

      .message-menu-button {
        width: 2rem;
        height: 2rem;
        border: 0;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.08);
        color: #333;
        font-size: 1.1rem;
        line-height: 1;
      }

      .message-menu {
        display: none;
        justify-content: flex-end;
        gap: 0.5rem;
        margin-top: 0.55rem;
      }

      .message-menu.open {
        display: flex;
      }

      .message-meta-row {
        width: fit-content;
        display: flex;
        gap: 0.35rem;
        margin-bottom: 0.35rem;
        color: #7b8794;
        font-size: 0.76rem;
      }

      .message-meta-row.mine {
        align-self: flex-end;
        margin-left: auto;
        margin-right: 0;
      }

      .message-meta-row.theirs {
        align-self: flex-start;
        margin-left: 0;
        margin-right: auto;
      }

      .message-unread-count {
        color: #f4b400;
        font-weight: 900;
      }

      .system-message {
        align-self: center;
        width: fit-content;
        max-width: min(90%, 620px);
        margin: 0.3rem auto;
        padding: 0.55rem 1rem;
        border-radius: 999px;
        background: #eef5fb;
        color: #7b8794;
        text-align: center;
        font-size: 0.9rem;
      }

      #room-form,
      #open-form {
        position: fixed;
        right: 0;
        bottom: 3.7rem;
        left: 0;
        display: none;
        gap: 0.78rem;
        padding: 0.8rem 1rem;
        background: rgba(255, 255, 255, 0.78);
        border-top: 1px solid #e3e8ef;
        backdrop-filter: blur(10px);
      }

      #room-form.active,
      #open-form.active {
        display: flex;
      }

      #room-input,
      #open-input {
        flex: 1;
        min-width: 0;
        border-radius: 999px;
      }

      #room-form button,
      #open-form button {
        min-width: 5.5rem;
        border-radius: 999px;
      }

      #bottom-tabs {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 8;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 0.25rem;
        padding: 0.45rem;
        background: rgba(255, 255, 255, 0.82);
        border-top: 1px solid #e3e8ef;
      }

      #bottom-tabs button {
        padding: 0.65rem 0.25rem;
        border: 0;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.72);
        color: #333;
      }

      #bottom-tabs button.active {
        background: #111827;
        color: white;
      }



      /* Final login screen polish.
         These rules come late so older common button styles cannot override the login card. */
      #auth-screen {
        justify-content: flex-end;
        padding-right: clamp(1.5rem, 9vw, 9rem);
      }

      #auth-box {
        width: min(92vw, 430px);
        gap: 0.78rem;
      }

      #auth-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      #login-button {
        background: linear-gradient(135deg, #2f73ff, #28a9ff);
        color: white;
        box-shadow: 0 10px 22px rgba(30, 144, 255, 0.3);
      }

      #signup-button {
        background: rgba(255, 255, 255, 0.9);
        color: #137fe8;
        border: 1px solid rgba(138, 160, 182, 0.32);
      }


      @media (max-width: 900px) {
        #auth-screen {
          justify-content: center;
          padding-right: 1.5rem;
        }
      }
      @media (max-width: 900px) {
        #auth-screen::before,
        #auth-screen::after {
          display: none;
        }
      }
      @media (max-width: 720px) {
        #room-name-form,
        #room-header {
          flex-direction: column;
          align-items: stretch;
        }

        .message-row,
        .message-meta-row {
          max-width: 86%;
        }
      }
      #room-view,
      #open-view {
        padding-bottom: 6.5rem;
      }

      #room-messages,
      #open-messages {
        padding-bottom: 6.5rem;
      }


      /* Coconut Chat visual texture layer.
         This block changes only the look: no HTML ids, API calls, or Socket.IO logic are changed. */
      :root {
        --coconut-ink: #102a43;
        --coconut-muted: #6f8297;
        --coconut-blue: #229aff;
        --coconut-blue-deep: #1687ed;
        --coconut-sky: #eaf8ff;
        --coconut-glass: rgba(255, 255, 255, 0.72);
        --coconut-card: rgba(255, 255, 255, 0.88);
        --coconut-line: rgba(160, 193, 219, 0.5);
        --coconut-shadow: 0 18px 48px rgba(11, 72, 112, 0.18);
      }

      body {
        color: var(--coconut-ink);
        font-weight: 500;
        letter-spacing: 0;
      }

      input {
        border-color: rgba(160, 193, 219, 0.62) !important;
        background: rgba(255, 255, 255, 0.88) !important;
        color: var(--coconut-ink);
        box-shadow: inset 0 1px 2px rgba(16, 42, 67, 0.04),
          0 6px 18px rgba(32, 125, 184, 0.08);
      }

      input::placeholder {
        color: #8a9bad;
      }

      input:focus {
        outline: 3px solid rgba(34, 154, 255, 0.18) !important;
        border-color: rgba(34, 154, 255, 0.68) !important;
      }

      #app {
        color: var(--coconut-ink);
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.7),
          rgba(255, 255, 255, 0.58)
        ) !important;
        border: 1px solid rgba(255, 255, 255, 0.78) !important;
        border-radius: 30px !important;
        box-shadow: 0 28px 80px rgba(8, 57, 94, 0.26) !important;
        backdrop-filter: blur(20px) saturate(1.12) !important;
      }

      #top-bar {
        min-height: 5.6rem;
        padding: 1rem 1.35rem !important;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.72),
          rgba(255, 255, 255, 0.4)
        ) !important;
        border-bottom: 1px solid rgba(255, 255, 255, 0.45) !important;
      }

      #my-nickname,
      #room-title,
      .section-title,
      .list-title,
      .message-sender {
        color: var(--coconut-ink);
        font-weight: 800;
        letter-spacing: 0;
      }

      #my-meta,
      .list-sub,
      .message-meta-row {
        color: var(--coconut-muted) !important;
      }

      #my-profile-image,
      #my-profile-placeholder,
      .avatar,
      .avatar-placeholder {
        box-shadow: 0 9px 24px rgba(9, 82, 126, 0.16);
        border: 2px solid rgba(255, 255, 255, 0.82);
      }

      .section,
      .list-item,
      .group-friend-item,
      #new-chat-menu {
        border: 1px solid var(--coconut-line) !important;
        border-radius: 18px !important;
        background: var(--coconut-card) !important;
        box-shadow: 0 10px 28px rgba(11, 72, 112, 0.1);
      }

      .section {
        padding: 1.15rem !important;
      }

      .primary-button,
      #auth-actions button,
      #room-form button,
      #open-form button,
      #new-chat-button,
      #add-friend-button,
      #create-group-button,
      #save-nickname-button,
      #save-status-message-button,
      #save-profile-image-button,
      #save-username-button,
      #save-password-button {
        border: 0 !important;
        border-radius: 999px !important;
        background: linear-gradient(135deg, #2f73ff, #28a9ff) !important;
        color: white !important;
        font-weight: 800 !important;
        box-shadow: 0 12px 24px rgba(30, 144, 255, 0.26) !important;
      }

      .primary-button:hover,
      #room-form button:hover,
      #open-form button:hover,
      #new-chat-button:hover {
        filter: brightness(1.03);
        transform: translateY(-1px);
      }

      .small-button {

  <body>
    <div id="auth-screen">

      function formatTime(value) {
        if (!value) {
          return '';
        }

        return new Date(value).toLocaleTimeString('ko-KR', {
          hour: '2-digit',
          minute: '2-digit'
        });
      }

      function authFetch(url, options = {}) {
        return fetch(url, {
          ...options,
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${loginToken}`,
            ...(options.headers || {})
          }
        });

      function createAvatar(user) {
        if (user.isBlocked) {
          const blocked = document.createElement('div');
          blocked.className = 'avatar-placeholder blocked-avatar';
          blocked.textContent = '⊘';
          return blocked;
        }

        if (user.profileImage) {
          const img = document.createElement('img');
          img.className = 'avatar';
          img.src = user.profileImage;
          img.alt = '프로필';
          return img;
        }

        const placeholder = document.createElement('div');
        placeholder.className = 'avatar-placeholder';
        placeholder.textContent = (user.nickname || user.username || '?')
          .slice(0, 1)
          .toUpperCase();

        return placeholder;
      }

      // 내 친구 코드를 클립보드에 복사한다.
      // 서버 요청 없이 브라우저에서만 처리되는 가벼운 UI 기능이다.
      async function copyMyFriendCode() {
        if (!currentUser || !currentUser.friendCode) {
          setPageMessage('복사할 친구 코드가 없습니다.');
          return;
        }

        try {
          await navigator.clipboard.writeText(currentUser.friendCode);
          setPageMessage('친구 코드를 복사했습니다.', true);
        } catch (e) {
          // 일부 브라우저나 file:/// 실행 환경에서는 Clipboard API가 막힐 수 있어서 예전 방식으로 한 번 더 시도한다.
          const tempInput = document.createElement('input');
          tempInput.value = currentUser.friendCode;
          document.body.appendChild(tempInput);
          tempInput.select();

          const copied = document.execCommand('copy');
          document.body.removeChild(tempInput);

          if (copied) {
            setPageMessage('친구 코드를 복사했습니다.', true);
          } else {
            setPageMessage('친구 코드 복사에 실패했습니다.');
          }
        }
      }

      // 지원되는 브라우저에서는 홈 화면에 설치된 앱 아이콘 배지도 갱신한다.
      // Android Chrome PWA에서는 환경에 따라 제한될 수 있으므로 실패해도 앱 내부 기능은 계속 동작하게 둔다.
      async function updateAppIconBadge(unreadCount) {
        if (!('setAppBadge' in navigator) || !('clearAppBadge' in navigator)) {
          return;
        }

        try {
          if (unreadCount > 0) {
            await navigator.setAppBadge(unreadCount);
          } else {
            await navigator.clearAppBadge();
          }
        } catch (e) {
          console.error('app badge update failed:', e);
        }
      }

      // 모든 개별/단체 채팅방의 안 읽은 메시지 수를 합산해서 우측 상단 배지에 표시한다.
      // 값이 0이면 배지를 숨기고, 99개를 넘으면 99+로 줄여서 레이아웃이 깨지지 않게 한다.
      function updateTotalUnreadBadge(totalUnreadCount) {
        const count = Number(totalUnreadCount || 0);

        if (count <= 0) {
          totalUnreadBadge.textContent = '0';
          totalUnreadBadge.classList.remove('visible');
          totalUnreadBadge.setAttribute('aria-label', '안 읽은 채팅 0개');
          updateAppIconBadge(0);
          return;
        }

        totalUnreadBadge.textContent = count > 99 ? '99+' : String(count);
        totalUnreadBadge.classList.add('visible');
        totalUnreadBadge.setAttribute('aria-label', `안 읽은 채팅 ${count}개`);
        updateAppIconBadge(count);
      }

      function getMessageSenderId(message) {
        return String(
          message.senderId ??
            message.sender_id ??
            message.senderID ??
            message.userId ??
            message.user_id ??
            ''
        );
      }

      function isMyMessage(message) {
        return Boolean(
          currentUser &&
            currentUser.id &&
            getMessageSenderId(message) &&
            getMessageSenderId(message) === String(currentUser.id)
        );
      }

      function applyBubbleStyle(item, isMine) {
        item.className = isMine ? 'message-row mine' : 'message-row theirs';

        item.style.alignSelf = isMine ? 'flex-end' : 'flex-start';

        item.style.marginRight = isMine ? '0' : 'auto';

        item.style.borderColor = isMine ? '#7bcfff' : '#e3e8ef';
        item.style.color = '#102a43';
      }

      function addOpenMessage(message, className) {
        if (className) {
          const item = document.createElement('li');
          item.className = `message-row ${className}`;
          item.textContent = message;
          openMessages.appendChild(item);
          window.scrollTo(0, document.body.scrollHeight);
          return;
        }

        const isMine = isMyMessage(message);

        const item = document.createElement('li');
        applyBubbleStyle(item, isMine);

        const head = document.createElement('div');
        head.className = 'message-head';

        const senderName = document.createElement('span');
        senderName.className = 'message-sender';
        senderName.textContent = isMine ? '나' : message.senderName;

        head.appendChild(senderName);

        const content = document.createElement('div');
        content.className = 'message-content';
        content.textContent = message.content;

        item.appendChild(head);
        item.appendChild(content);
        openMessages.appendChild(item);

        const meta = document.createElement('li');
        meta.className = isMine ? 'message-meta-row mine' : 'message-meta-row theirs';
        meta.style.alignSelf = isMine ? 'flex-end' : 'flex-start';

        meta.style.marginRight = isMine ? '0' : 'auto';

        const time = document.createElement('span');

        time.textContent = formatTime(message.createdAt);

      async function requestAuth(type) {
        const username = usernameInput.value.trim();
        const password = passwordInput.value;

        authMessage.style.color = '#c0392b';
        authMessage.textContent = '';

        if (!username || password.length < 6) {
          authMessage.textContent = '아이디와 6자 이상 비밀번호가 필요합니다.';
          return;
        }

        try {
          const response = await fetch(`/api/${type}`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              username,
              password
            })
          });

          const data = await response.json();

          if (!response.ok) {
            authMessage.textContent = data.message || '요청 실패';
            return;
          }

          if (type === 'signup') {
            authMessage.style.color = '#167a55';
            authMessage.textContent = '회원가입 완료! 이제 로그인하세요.';
            passwordInput.value = '';
            passwordInput.focus();
            return;
          }

          loginToken = data.token;
          localStorage.setItem('loginToken', loginToken);

          renderMe(data.user);
          startApp();
        } catch (e) {
          authMessage.textContent = '서버 연결 실패';
        }
      }

      async function loadMe() {
        loginToken = localStorage.getItem('loginToken');

        if (!loginToken) {
          return;
        }

        try {
          const response = await authFetch('/api/me');

          if (!response.ok) {
            localStorage.removeItem('loginToken');
            loginToken = null;
            return;
          }

          const data = await response.json();

          renderMe(data.user);
          startApp();
        } catch (e) {
          localStorage.removeItem('loginToken');
          loginToken = null;
        }
      }

      function startApp() {
        isLoggingOut = false;
        authScreen.style.display = 'none';
        app.style.display = 'block';

        connectSocket();
        loadFriends();
        loadRooms();
      }

      function connectSocket() {
        if (socket) {
          socket.disconnect();
        }

        socket = io({
          auth: {
            token: loginToken
          }
        });

        socket.on('connect_error', () => {
          authScreen.style.display = 'flex';
          app.style.display = 'none';
          authMessage.textContent = '채팅 서버 인증에 실패했습니다.';
        });

        socket.on('auth error', (msg) => {
          authScreen.style.display = 'flex';
          app.style.display = 'none';
          authMessage.textContent = msg || '로그인이 필요합니다.';
        });

        socket.on('chat message', (message, oldMsg) => {
          if (isLoggingOut) {
            return;
          }

          if (typeof message === 'object' && message !== null) {
            addOpenMessage(message);
          } else {
            addOpenMessage({
              senderId: '',
              senderName: message,
              content: oldMsg,
              createdAt: new Date().toISOString()
            });
          }
        });

        socket.on('system message', (msg) => {
          if (isLoggingOut) {
            return;
          }

          addOpenMessage(msg, 'system-message');
        });

        socket.on('room message', (message) => {
          const roomViewIsOpen = document
            .getElementById('room-view')
            .classList.contains('active');

          if (
            roomViewIsOpen &&
            currentRoomId &&
            String(message.roomId) === String(currentRoomId)
          ) {
            renderRoomMessage(message);
            markCurrentRoomRead(message.id);
          }

          loadRooms();
        });

        socket.on('rooms changed', () => {
          loadRooms();
        });

        socket.on('room read', (payload) => {
          const roomViewIsOpen = document
            .getElementById('room-view')
            .classList.contains('active');

          if (
            roomViewIsOpen &&
            currentRoomId &&
            String(payload.roomId) === String(currentRoomId)
          ) {
            reloadCurrentRoomMessages(false);
          }

          loadRooms();
        });

        socket.on('friends changed', () => {
          loadFriends();

          if (currentRoomId && roomInfoPanel.classList.contains('open')) {
            loadRoomMembers();
          }
        });

        socket.on('room message deleted', (payload) => {
          if (!currentRoomId || String(payload.roomId) !== String(currentRoomId)) {
            loadRooms();
            return;
          }

          const item = roomMessages.querySelector(
            `[data-message-id="${payload.messageId}"]`
          );

          if (!item) {
            return;
          }

          const content = item.querySelector('.message-content');
          const menu = item.querySelector('.message-menu');
          const meta = roomMessages.querySelector(
            `[data-message-meta-for="${payload.messageId}"]`
          );

          content.textContent = '삭제된 메시지입니다.';

          if (menu) {
            menu.remove();
          }

          if (meta) {
            meta.remove();
          }

          loadRooms();
        });
      }

      async function loadFriends() {

            left.appendChild(text);

            directButton.className = 'small-button';
            directButton.textContent = '1:1 채팅';

            deleteButton.textContent = '삭제';

              deleteFriend(friend.id);

            right.appendChild(directButton);

            item.appendChild(right);

            const directItem = document.createElement('div');
            directItem.className = 'list-item';
            directItem.appendChild(left.cloneNode(true));

            directStartButton.type = 'button';
            directStartButton.className = 'small-button';
            directStartButton.textContent = '시작';
            directStartButton.addEventListener('click', () => {
              createDirectRoom(friend.id);
            });

            directItem.appendChild(directStartButton);
            directFriendsList.appendChild(directItem);

            const groupItem = document.createElement('label');
            groupItem.className = 'group-friend-item';
            groupItem.innerHTML = `
              <span>${friend.nickname}</span>
              <input class="group-friend-checkbox" type="checkbox" value="${friend.id}" />
            `;
            groupFriendsList.appendChild(groupItem);
          }
        } catch (e) {
          setPageMessage('친구 목록 조회 중 서버 연결 실패');
        }
      }

      async function loadRooms() {
        try {
          const response = await authFetch('/api/rooms');
          const data = await response.json();

          if (!response.ok) {
            setPageMessage(data.message || '채팅방 조회 실패');
            return;
          }

          roomsList.innerHTML = '';

          const totalUnreadCount = data.rooms.reduce((sum, room) => {
            return sum + Number(room.unreadCount || 0);
          }, 0);

          updateTotalUnreadBadge(totalUnreadCount);

          if (data.rooms.length === 0) {
            roomsList.textContent = '아직 채팅방이 없습니다.';
            return;
          }

          for (const room of data.rooms) {
            const item = document.createElement('div');
            item.className = 'list-item';

            const title = room.name || (room.type === 'direct' ? '1:1 채팅' : '단체 채팅');

            item.innerHTML = `
              <div class="list-main">
                <div class="list-title">${title}</div>
                <div class="list-sub">${room.lastMessage || '메시지 없음'}</div>
              </div>
            `;

            if (room.unreadCount > 0) {
              const badge = document.createElement('span');
              badge.className = 'badge';
              badge.textContent = room.unreadCount > 99 ? '99+' : room.unreadCount;
              item.appendChild(badge);
            }

            item.addEventListener('click', () => {
              openRoom(room.id, title);
            });

            roomsList.appendChild(item);
          }
        } catch (e) {
          setPageMessage('채팅방 조회 중 서버 연결 실패');
        }
      }

      async function loadRoomMembers() {
        if (!currentRoomId) {
          return;
        }

        try {
          const response = await authFetch(`/api/rooms/${currentRoomId}/members`);
          const data = await response.json();

          if (!response.ok) {

          roomInfoPanel.innerHTML = '';

          for (const member of data.members) {

            const left = document.createElement('div');
            left.className = 'profile-line';
            left.appendChild(createAvatar(member));

            const text = document.createElement('div');

            text.innerHTML = `
              <div class="list-title">${member.nickname}</div>
              <div class="list-sub">${member.statusMessage || ''}</div>
            `;

            left.appendChild(text);

            const right = document.createElement('div');

            const moreButton = document.createElement('button');
            moreButton.className = 'small-button';
            moreButton.type = 'button';
            moreButton.textContent = '...';

            const menu = document.createElement('div');
            menu.className = 'member-menu';

            const addButton = document.createElement('button');
            addButton.className = 'small-button';
            addButton.type = 'button';
            addButton.textContent = member.isFriend ? '친구 추가됨' : '친구 추가';
            addButton.disabled = member.isFriend || String(member.id) === String(currentUser.id);
            addButton.addEventListener('click', () => {
              addFriendByUserId(member.id);
            });

            const blockButton = document.createElement('button');
            blockButton.className = 'small-button';
            blockButton.type = 'button';
            blockButton.textContent = member.isBlocked ? '차단됨' : '차단';
            blockButton.disabled = member.isBlocked || String(member.id) === String(currentUser.id);
            blockButton.addEventListener('click', () => {
              blockUser(member.id);
            });

            moreButton.addEventListener('click', () => {
              menu.classList.toggle('open');
            });

            menu.appendChild(addButton);
            menu.appendChild(blockButton);
            right.appendChild(moreButton);
            right.appendChild(menu);

            item.appendChild(left);
            item.appendChild(right);
            roomInfoPanel.appendChild(item);
          }
        } catch (e) {
          setPageMessage('멤버 조회 중 서버 연결 실패');
        }
      }

      async function addFriendByCode() {
        const friendCode = friendCodeInput.value.trim();

        try {
          const response = await authFetch('/api/friends/by-code', {
            method: 'POST',
            body: JSON.stringify({ friendCode })
          });

          const data = await response.json();

          if (!response.ok) {
            setPageMessage(data.message || '친구 추가 실패');
            return;
          }

          friendCodeInput.value = '';
          setPageMessage('친구를 추가했습니다.', true);
          loadFriends();
        } catch (e) {
          setPageMessage('친구 추가 중 서버 연결 실패');
        }
      }

      async function addFriendByUserId(userId) {
        try {
          const response = await authFetch(`/api/friends/by-user/${userId}`, {
            method: 'POST'
          });

          const data = await response.json();

          if (!response.ok) {
            setPageMessage(data.message || '친구 추가 실패');
            return;
          }

          setPageMessage('친구를 추가했습니다.', true);
          loadFriends();
          loadRoomMembers();
        } catch (e) {
          setPageMessage('친구 추가 중 서버 연결 실패');
        }
      }

      async function deleteFriend(friendId) {
        try {
          const response = await authFetch(`/api/friends/${friendId}`, {
            method: 'DELETE'
          });

          const data = await response.json();

          if (!response.ok) {
            setPageMessage(data.message || '친구 삭제 실패');
            return;
          }

          setPageMessage('친구를 삭제했습니다.', true);
          loadFriends();
        } catch (e) {
          setPageMessage('친구 삭제 중 서버 연결 실패');
        }
      }

      async function blockUser(userId) {
        try {
          const response = await authFetch(`/api/blocks/${userId}`, {
            method: 'POST'
          });

          const data = await response.json();

          if (!response.ok) {
            setPageMessage(data.message || '차단 실패');
            return;
          }

          setPageMessage('사용자를 차단했습니다.', true);
          loadFriends();
          loadRooms();
          loadRoomMembers();
        } catch (e) {
          setPageMessage('차단 중 서버 연결 실패');
        }
      }

      async function createDirectRoom(friendId) {
        try {
          const response = await authFetch('/api/rooms/direct', {
            method: 'POST',
            body: JSON.stringify({ friendId })
          });

          const data = await response.json();

          if (!response.ok) {
            setPageMessage(data.message || '채팅방 생성 실패');
            return;
          }

          setPageMessage('1:1 채팅방을 만들었습니다.', true);
          directChatPanel.classList.remove('open');
          groupChatPanel.classList.remove('open');
          showView('rooms-view');
          loadRooms();
        } catch (e) {
          setPageMessage('1:1 채팅방 생성 중 서버 연결 실패');
        }
      }

      async function createGroupRoom() {
        const checked = document.querySelectorAll('.group-friend-checkbox:checked');
        const memberIds = [...checked].map((checkbox) => checkbox.value);

        try {
          const response = await authFetch('/api/rooms/group', {
            method: 'POST',
            body: JSON.stringify({
              name: groupNameInput.value.trim(),
              memberIds
            })
          });

          const data = await response.json();

          if (!response.ok) {
            setPageMessage(data.message || '단체 채팅방 생성 실패');
            return;
          }

          groupNameInput.value = '';
          checked.forEach((checkbox) => {
            checkbox.checked = false;
          });

          setPageMessage('단체 채팅방을 만들었습니다.', true);
          groupFriendsList.classList.remove('open');
          directChatPanel.classList.remove('open');
          groupChatPanel.classList.remove('open');
          showView('rooms-view');
          loadRooms();
        } catch (e) {
          setPageMessage('단체 채팅방 생성 중 서버 연결 실패');
        }
      }

      async function reloadCurrentRoomMessages(markAsRead) {
        if (!currentRoomId) {
          return;
        }

        try {
          const response = await authFetch(`/api/rooms/${currentRoomId}/messages`);
          const data = await response.json();

          if (!response.ok) {
            setPageMessage(data.message || '메시지 조회 실패');
            return;
          }

          currentRoomLastMessageId = 0;
          roomMessages.innerHTML = '';

          for (const message of data.messages) {
            renderRoomMessage(message);
          }

          if (markAsRead && currentRoomLastMessageId > 0) {
            markCurrentRoomRead(currentRoomLastMessageId);
          }

          loadRooms();
        } catch (e) {
          setPageMessage('메시지 조회 중 서버 연결 실패');
        }
      }

      async function openRoom(roomId, title) {
        currentRoomId = String(roomId);
        currentRoomLastMessageId = 0;
        roomTitle.textContent = title;
        roomNameInput.value = title;
        roomMessages.innerHTML = '';
        roomInfoPanel.innerHTML = '';
        roomInfoPanel.classList.remove('open');

        showView('room-view');

        if (socket) {
          socket.emit('join room', currentRoomId);
        }

        await reloadCurrentRoomMessages(true);
      }

      async function markCurrentRoomRead(lastReadMessageId) {
        if (!currentRoomId || !lastReadMessageId) {
          return;
        }

        await authFetch(`/api/rooms/${currentRoomId}/read`, {
          method: 'POST',
          body: JSON.stringify({ lastReadMessageId })
        });

        loadRooms();
      }

      async function renameCurrentRoom() {
        if (!currentRoomId) {
          return;
        }

        const name = roomNameInput.value.trim();

        try {
          const response = await authFetch(`/api/rooms/${currentRoomId}/name`, {
            method: 'PATCH',
            body: JSON.stringify({ name })
          });

          const data = await response.json();

          if (!response.ok) {
            setPageMessage(data.message || '채팅방 이름 변경 실패');
            return;
          }

          roomTitle.textContent = data.room.name;
          roomNameInput.value = data.room.name;

          setPageMessage(data.message || '채팅방 이름을 변경했습니다.', true);
          loadRooms();
        } catch (e) {
          setPageMessage('채팅방 이름 변경 중 서버 연결 실패');
        }
      }

      async function leaveCurrentRoom() {
        if (!currentRoomId) {
          return;
        }

        try {
          const response = await authFetch(`/api/rooms/${currentRoomId}/leave`, {
            method: 'POST'
          });

          const data = await response.json();

          if (!response.ok) {
            setPageMessage(data.message || '채팅방 나가기 실패');
            return;
          }

          currentRoomId = null;
          currentRoomLastMessageId = 0;
          roomMessages.innerHTML = '';
          roomInfoPanel.innerHTML = '';

          setPageMessage('채팅방에서 나갔습니다.', true);
          showView('rooms-view');
          loadRooms();
        } catch (e) {
          setPageMessage('채팅방 나가기 중 서버 연결 실패');
        }
      }

      async function deleteMessageForMe(messageId) {
        if (!currentRoomId) {
          return;
        }

        await authFetch(`/api/rooms/${currentRoomId}/messages/${messageId}/me`, {
          method: 'DELETE'
        });

        loadRooms();
      }

      async function deleteMessageForEveryone(messageId) {
        if (!currentRoomId) {
          return;
        }

        const response = await authFetch(
          `/api/rooms/${currentRoomId}/messages/${messageId}/everyone`,
          { method: 'DELETE' }
        );

        const data = await response.json();

        if (!response.ok) {
          setPageMessage(data.message || '모두에게서 삭제 실패');
        }
      }

      async function saveNickname() {
        const nickname = nicknameEditInput.value.trim();

        try {
          const response = await authFetch('/api/me/nickname', {
            method: 'PATCH',
            body: JSON.stringify({ nickname })
          });

          const data = await response.json();

          if (!response.ok) {
            setPageMessage(data.message || '닉네임 수정 실패');
            return;
          }

          renderMe(data.user);
          setPageMessage(data.message || '닉네임을 수정했습니다.', true);
        } catch (e) {
          setPageMessage('닉네임 수정 중 서버 연결 실패');
        }
      }

      async function saveStatusMessage() {
        const statusMessage = statusMessageInput.value.trim();

        try {
          const response = await authFetch('/api/me/status-message', {
            method: 'PATCH',
            body: JSON.stringify({ statusMessage })
          });

          const data = await response.json();

          if (!response.ok) {
            setPageMessage(data.message || '상태메시지 수정 실패');
            return;
          }

          renderMe(data.user);
          setPageMessage(data.message || '상태메시지를 수정했습니다.', true);
        } catch (e) {
          setPageMessage('상태메시지 수정 중 서버 연결 실패');
        }
      }

      async function saveProfileImage() {
        const profileImage = profileImageInput.value.trim();

        try {
          const response = await authFetch('/api/me/profile-image', {
            method: 'PATCH',
            body: JSON.stringify({ profileImage })
          });

          const data = await response.json();

          if (!response.ok) {
            setPageMessage(data.message || '프로필 이미지 수정 실패');
            return;
          }

          renderMe(data.user);
          setPageMessage(data.message || '프로필 이미지를 수정했습니다.', true);
        } catch (e) {
          setPageMessage('프로필 이미지 수정 중 서버 연결 실패');
        }
      }

      async function saveUsername() {
        try {
          const response = await authFetch('/api/me/username', {
            method: 'PATCH',
            body: JSON.stringify({
              newUsername: usernameEditInput.value.trim(),
              currentPassword: usernamePasswordInput.value
            })
          });

          const data = await response.json();

          if (!response.ok) {
            setPageMessage(data.message || '아이디 변경 실패');
            return;
          }

          loginToken = data.token;
          localStorage.setItem('loginToken', loginToken);

          renderMe(data.user);
          usernamePasswordInput.value = '';
          setPageMessage(data.message || '아이디를 변경했습니다.', true);
        } catch (e) {
          setPageMessage('아이디 변경 중 서버 연결 실패');
        }
      }

      async function savePassword() {
        try {
          const response = await authFetch('/api/me/password', {
            method: 'PATCH',
            body: JSON.stringify({
              currentPassword: currentPasswordInput.value,
              newPassword: newPasswordInput.value,
              newPasswordConfirm: newPasswordConfirmInput.value
            })
          });

          const data = await response.json();

          if (!response.ok) {
            setPageMessage(data.message || '비밀번호 변경 실패');
            return;
          }

          currentPasswordInput.value = '';
          newPasswordInput.value = '';
          newPasswordConfirmInput.value = '';
          setPageMessage(data.message || '비밀번호를 변경했습니다.', true);
        } catch (e) {
          setPageMessage('비밀번호 변경 중 서버 연결 실패');
        }
      }

      function logout() {
        isLoggingOut = true;
        localStorage.removeItem('loginToken');
        loginToken = null;
        currentUser = null;
        currentRoomId = null;
        currentRoomLastMessageId = 0;

        if (socket) {
          socket.disconnect();
          socket = null;
        }

        openMessages.innerHTML = '';
        updateTotalUnreadBadge(0);

        app.style.display = 'none';
        authScreen.style.display = 'flex';
        authMessage.textContent = '';
        pageMessage.textContent = '';
        passwordInput.value = '';
      }

      loginButton.addEventListener('click', () => requestAuth('login'));
      signupButton.addEventListener('click', () => requestAuth('signup'));

      passwordInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          requestAuth('login');
        }
      });

      copyFriendCodeButton.addEventListener('click', copyMyFriendCode);
      addFriendButton.addEventListener('click', addFriendByCode);

      newChatButton.addEventListener('click', () => {
        newChatMenu.classList.toggle('open');
      });

      directChatOptionButton.addEventListener('click', () => {
        openNewChatPanel('direct');
      });

      groupChatOptionButton.addEventListener('click', () => {
        openNewChatPanel('group');
      });

      toggleGroupFriendsButton.addEventListener('click', () => {
        groupFriendsList.classList.toggle('open');
      });

      createGroupButton.addEventListener('click', createGroupRoom);
      leaveRoomButton.addEventListener('click', leaveCurrentRoom);

      roomInfoButton.addEventListener('click', () => {
        roomInfoPanel.classList.toggle('open');

        if (roomInfoPanel.classList.contains('open')) {
          loadRoomMembers();
        }
      });

      roomNameForm.addEventListener('submit', (e) => {
        e.preventDefault();
        renameCurrentRoom();
      });

      saveNicknameButton.addEventListener('click', saveNickname);
      saveStatusMessageButton.addEventListener('click', saveStatusMessage);
      saveProfileImageButton.addEventListener('click', saveProfileImage);
      saveUsernameButton.addEventListener('click', saveUsername);
      savePasswordButton.addEventListener('click', savePassword);
      logoutButton.addEventListener('click', logout);

      roomForm.addEventListener('submit', (e) => {
        e.preventDefault();

        if (!socket || !currentRoomId || !roomInput.value.trim()) {
          return;
        }

        socket.emit('room message', currentRoomId, roomInput.value, () => {
          roomInput.value = '';
        });
      });

      openForm.addEventListener('submit', (e) => {
        e.preventDefault();

        if (!socket || !openInput.value.trim()) {
          return;
        }

        socket.emit('chat message', openInput.value, () => {
          openInput.value = '';
        });
      });

      tabButtons.forEach((button) => {
        button.addEventListener('click', () => {
          showView(button.dataset.view);

          if (button.dataset.view === 'friends-view') {
            loadFriends();
          }

          if (button.dataset.view === 'rooms-view') {
            loadRooms();
          }
        });
      });

      // PWA 등록: file:///로 열 때는 서비스워커가 동작하지 않으므로 서버 주소에서만 등록한다.
      // 로컬에서는 http://localhost:3000, 배포 후에는 Render의 https 주소에서 설치 가능해진다.
      if ('serviceWorker' in navigator && window.location.protocol !== 'file:') {
        navigator.serviceWorker.register('/service-worker.js').catch((e) => {
        console.error('service worker registration failed:', e);
       });
      }
      loadMe();
    </script>
  </body>
</html>
