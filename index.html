<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Coconut Chat</title>

    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding-bottom: 3.5rem;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        background: #fafafa;
        color: #222;
      }

      #auth-screen {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        background: white;
      }

      #auth-box {
        width: min(90vw, 360px);
        display: grid;
        gap: 0.75rem;
      }

      #auth-title {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
        text-align: center;
      }

      #username-input,
      #password-input {
        width: 100%;
        padding: 0.85rem 1rem;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 1rem;
      }

      #auth-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.5rem;
      }

      #auth-actions button {
        padding: 0.85rem 1rem;
        border: 0;
        border-radius: 6px;
        background: #333;
        color: white;
        font-size: 1rem;
        cursor: pointer;
      }

      #signup-button {
        background: #167a55;
      }

      #auth-message {
        min-height: 1.25rem;
        margin: 0;
        color: #c0392b;
        text-align: center;
        font-size: 0.9rem;
      }

      #top-bar {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        justify-content: flex-end;
        padding: 0.75rem 1rem;
        background: rgba(255, 255, 255, 0.9);
        border-bottom: 1px solid #e6e6e6;
        backdrop-filter: blur(10px);
      }

      #online-count {
        font-size: 0.9rem;
        color: #333;
      }

      #messages {
        list-style-type: none;
        margin: 0;
        padding: 0;
      }

      #messages > li {
        padding: 0.65rem 1rem;
        word-break: break-word;
      }

      #messages > li:nth-child(odd) {
        background: #f0f0f0;
      }

      .system-message {
        color: #777;
        text-align: center;
        font-size: 0.9rem;
      }

      #form {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        display: flex;
        height: 3.5rem;
        padding: 0.35rem;
        background: rgba(0, 0, 0, 0.12);
        backdrop-filter: blur(10px);
      }

      #input {
        flex: 1;
        min-width: 0;
        margin: 0.25rem;
        padding: 0 1rem;
        border: 0;
        border-radius: 999px;
        font-size: 1rem;
      }

      #input:focus {
        outline: none;
      }

      #form > button {
        margin: 0.25rem;
        padding: 0 1rem;
        border: 0;
        border-radius: 6px;
        background: #333;
        color: white;
        font-size: 1rem;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <div id="auth-screen">
      <div id="auth-box">
        <h1 id="auth-title">Coconut Chat</h1>

        <input id="username-input" autocomplete="username" placeholder="아이디" />

        <input
          id="password-input"
          type="password"
          autocomplete="current-password"
          placeholder="비밀번호 6자리 이상"
        />

        <div id="auth-actions">
          <button id="login-button" type="button">로그인</button>
          <button id="signup-button" type="button">회원가입</button>
        </div>

        <p id="auth-message"></p>
      </div>
    </div>

    <div id="top-bar">
      <span id="online-count">현재 접속자: 0명</span>
    </div>

    <ul id="messages"></ul>

    <form id="form" action="">
      <input id="input" autocomplete="off" />
      <button>Send</button>
    </form>

    <script src="/socket.io/socket.io.js"></script>

    <script>
      let socket = null;
      let loginToken = null;

      const authScreen = document.getElementById('auth-screen');
      const usernameInput = document.getElementById('username-input');
      const passwordInput = document.getElementById('password-input');
      const loginButton = document.getElementById('login-button');
      const signupButton = document.getElementById('signup-button');
      const authMessage = document.getElementById('auth-message');

      const onlineCount = document.getElementById('online-count');
      const form = document.getElementById('form');
      const input = document.getElementById('input');
      const messages = document.getElementById('messages');

      function addMessage(text, className) {
        const item = document.createElement('li');

        item.textContent = text;

        if (className) {
          item.className = className;
        }

        messages.appendChild(item);
        window.scrollTo(0, document.body.scrollHeight);
      }

      async function requestAuth(type) {
        const username = usernameInput.value.trim();
        const password = passwordInput.value;

        authMessage.style.color = '#c0392b';
        authMessage.textContent = '';

        if (!username || password.length < 6) {
          authMessage.textContent = '아이디와 6자 이상 비밀번호가 필요합니다.';
          return;
        }

        try {
          const response = await fetch(`/api/${type}`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              username,
              password
            })
          });

          const data = await response.json();

          if (!response.ok) {
            authMessage.textContent = data.message || '요청 실패';
            return;
          }

          if (type === 'signup') {
            authMessage.style.color = '#167a55';
            authMessage.textContent = '회원가입 완료! 이제 로그인하세요.';
            passwordInput.value = '';
            passwordInput.focus();
            return;
          }

          loginToken = data.token;
          startChat();
        } catch (e) {
          authMessage.textContent = '서버 연결 실패';
        }
      }

      function startChat() {
        authScreen.style.display = 'none';

        socket = io({
          auth: {
            token: loginToken
          }
        });

        socket.on('connect_error', () => {
          authScreen.style.display = 'flex';
          authMessage.style.color = '#c0392b';
          authMessage.textContent = '채팅 서버 인증에 실패했습니다.';
        });

        socket.on('auth error', (msg) => {
          authScreen.style.display = 'flex';
          authMessage.style.color = '#c0392b';
          authMessage.textContent = msg || '로그인이 필요합니다.';
        });

        socket.on('chat message', (username, msg) => {
          addMessage(`[${username}] ${msg}`);
        });

        socket.on('system message', (msg) => {
          addMessage(msg, 'system-message');
        });

        socket.on('online count', (count) => {
          onlineCount.textContent = `현재 접속자: ${count}명`;
        });
      }

      loginButton.addEventListener('click', () => {
        requestAuth('login');
      });

      signupButton.addEventListener('click', () => {
        requestAuth('signup');
      });

      passwordInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          requestAuth('login');
        }
      });

      form.addEventListener('submit', (e) => {
        e.preventDefault();

        if (!socket || !input.value.trim()) {
          return;
        }

        const msg = input.value;

        socket.emit('chat message', msg, () => {
          input.value = '';
        });

        input.value = '';
      });
    </script>
  </body>
</html>
