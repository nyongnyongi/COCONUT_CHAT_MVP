<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Socket.IO chat</title>
    <style>
      body {
        margin: 0;
        padding-bottom: 3rem;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      #nickname-screen {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: white;
        z-index: 10;
      }

      #nickname-box {
        display: flex;
        gap: 0.5rem;
      }

      #nickname-input {
        padding: 0.75rem 1rem;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 1rem;
      }

      #nickname-button {
        padding: 0.75rem 1rem;
        border: none;
        background: #333;
        color: white;
        border-radius: 4px;
        font-size: 1rem;
      }

      #form {
        background: rgba(0, 0, 0, 0.15);
        padding: 0.25rem;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        height: 3rem;
        box-sizing: border-box;
        backdrop-filter: blur(10px);
      }

      #input {
        border: none;
        padding: 0 1rem;
        flex-grow: 1;
        border-radius: 2rem;
        margin: 0.25rem;
      }

      #input:focus {
        outline: none;
      }

      #form > button {
        background: #333;
        border: none;
        padding: 0 1rem;
        margin: 0.25rem;
        border-radius: 3px;
        outline: none;
        color: #fff;
      }

      #messages {
        list-style-type: none;
        margin: 0;
        padding: 0;
      }

      #messages > li {
        padding: 0.5rem 1rem;
      }

      #messages > li:nth-child(odd) {
        background: #efefef;
      }

      .system-message {
        color: #777;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <!-- 변경: prompt 대신 직접 만든 닉네임 입력 화면 사용 -->
    <div id="nickname-screen">
      <div id="nickname-box">
        <!-- 변경: maxlength로 클라이언트에서도 닉네임 길이 제한 -->
        <input id="nickname-input" autocomplete="off" placeholder="닉네임" maxlength="20" />
        <button id="nickname-button">시작</button>
      </div>
    </div>

    <ul id="messages"></ul>

    <form id="form" action="">
      <!-- 변경: maxlength로 메시지 길이 제한 -->
      <input id="input" autocomplete="off" maxlength="500" />
      <button>Send</button>
    </form>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      let counter = 0;
      let nickname = '익명';
      let socket;

      // 변경: 시작 버튼/Enter 연타로 socket이 여러 개 생기는 것을 방지.
      let started = false;

      const nicknameScreen = document.getElementById('nickname-screen');
      const nicknameInput = document.getElementById('nickname-input');
      const nicknameButton = document.getElementById('nickname-button');

      const form = document.getElementById('form');
      const input = document.getElementById('input');
      const messages = document.getElementById('messages');

      function appendMessage(text, className) {
        const item = document.createElement('li');

        // 변경: innerHTML 대신 textContent 사용.
        // 사용자가 <script> 같은 값을 보내도 HTML로 실행되지 않음.
        item.textContent = text;

        if (className) {
          item.className = className;
        }

        messages.appendChild(item);
        window.scrollTo(0, document.body.scrollHeight);
      }

      function startChat() {
        if (started) return;
        started = true;

        // 변경: 닉네임 공백 제거 + 빈 값이면 익명 + 최대 20자 제한.
        nickname = nicknameInput.value.trim().slice(0, 20) || '익명';

        nicknameScreen.style.display = 'none';

        // 변경: 닉네임이 정해진 뒤 Socket.IO 연결 시작.
        socket = io({
          ackTimeout: 10000,
          retries: 3,
          auth: {
            serverOffset: 0
          }
        });

        socket.emit('set nickname', nickname, () => {
          console.log('nickname registered');
        });

        socket.on('chat message', (nickname, msg, serverOffset) => {
          appendMessage(`[${nickname}] ${msg}`);

          // 변경: 마지막으로 받은 서버 메시지 id를 저장해서 재연결 시 누락분을 받음.
          socket.auth.serverOffset = serverOffset;
        });

        socket.on('system message', (msg) => {
          appendMessage(msg, 'system-message');
        });
      }

      nicknameButton.addEventListener('click', startChat);

      nicknameInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          startChat();
        }
      });

      form.addEventListener('submit', (e) => {
        e.preventDefault();

        if (!socket) return;

        // 변경: 메시지 공백 제거 + 빈 메시지 전송 방지 + 최대 500자 제한.
        const msg = input.value.trim().slice(0, 500);

        if (!msg) return;

        const clientOffset = `${socket.id}-${counter++}`;

        socket.emit('chat message', nickname, msg, clientOffset, () => {
          input.value = '';
        });
      });
    </script>
  </body>
</html>
